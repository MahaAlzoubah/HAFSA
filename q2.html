<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاختبار الأول - أ. حفصة الدوسري</title>
  <style>
    body {
      margin-top: 50px;
      background-color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #backgroundCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    h1 {
      color: #de0fbf;
    }

    button {
      background-color: #2f51cb;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      margin-top: 20px;
      cursor: pointer;
    }

    .choices button {
      margin: 10px;
    }

    img {
      display: block;
      margin: 10px auto;
      max-width: 60%;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    @media (max-width: 600px) {
      body {
        margin-top: 100px;
      }
      h1 {
        font-size: 16px;
      }
      img {
        width: 80%;
        height: auto;
        margin: 10px auto;
      }
    }
  </style>
</head>
<body>

<canvas id="backgroundCanvas"></canvas>

<h1>الاختبار الأول</h1>
<img src="q2.jpeg" alt="Question Image">
<div class="choices">
  <button onclick="checkAnswer(1)">1</button>
  <button onclick="checkAnswer(2)">2</button>
  <button onclick="checkAnswer(3)">3</button>
</div>
<h3>أ. حفصة الدوسري</h3>
<div class="buttons">
  <button onclick="window.location.href='index2.html'">العودة إلى الدرس</button>
</div>

<audio id="clapSound" src="clap.mp3"></audio>

<!-- 🎨 خلفية الأشكال العشوائية -->
<script>
  const bgCanvas = document.getElementById('backgroundCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const colors = ['#ff6b6b', '#1e90ff', '#ffd93d', '#6bcf63', '#ff9ff3'];

  function drawShapesBackground() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    for (let i = 0; i < 50; i++) {
      const x = Math.random() * bgCanvas.width;
      const y = Math.random() * bgCanvas.height;
      const size = Math.random() * 30 + 10;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const shape = Math.floor(Math.random() * 3); // 0 = circle, 1 = square, 2 = triangle

      bgCtx.fillStyle = color;

      if (shape === 0) {
        bgCtx.beginPath();
        bgCtx.arc(x, y, size / 2, 0, Math.PI * 2);
        bgCtx.fill();
      } else if (shape === 1) {
        bgCtx.fillRect(x, y, size, size);
      } else {
        bgCtx.beginPath();
        bgCtx.moveTo(x, y);
        bgCtx.lineTo(x + size, y);
        bgCtx.lineTo(x + size / 2, y - size);
        bgCtx.closePath();
        bgCtx.fill();
      }
    }
  }

  function resizeCanvas() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    drawShapesBackground();
  }

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("load", resizeCanvas);
</script>

<!-- ✅ منطق الإجابة -->
<script>
  function checkAnswer(answer) {
    const clapSound = document.getElementById('clapSound');
    if (answer === 1) {
      clapSound.play();
      alert('! أحسنت إجابتك صحيحة');
    } else {
      alert('حاول مرة أخرى');
    }
  }
</script>

</body>
</html>
