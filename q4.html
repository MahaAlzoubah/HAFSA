<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>السؤال الثالث - أ. حفصة الدوسري</title>
  <style>
    body {
      margin-top: 50px;
      background-color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #backgroundCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    h1 {
      color: #cb2f2f;
      margin-top: 150px;
    }

    p {
      font-size: 20px;
      font-weight: bold;
      margin: 20px;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 16px;
      width: 200px;
      text-align: center;
    }

    button {
      background-color: #2f51cb;
      border: none;
      color: white;
      padding: 12px 30px;
      margin-top: 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 18px;
      }
      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

<canvas id="backgroundCanvas"></canvas>

<h1>السؤال الثالث: مسألة لفظية</h1>

<p>تحركت نقطة (4، 2) ثم انعكست حول المحور X.<br> ما إحداثيات النقطة الجديدة؟</p>

<input type="text" id="answer" placeholder="اكتب الإجابة هنا مثل: (1, -6)">

<br>
<button onclick="checkAnswer()">تحقق من الإجابة</button>

<div class="buttons">
  <button onclick="window.location.href='index.html'">العودة إلى الدرس</button>
</div>

<audio id="clapSound" src="clap.mp3"></audio>

<!-- 🎨 خلفية الأشكال -->
<script>
  const bgCanvas = document.getElementById('backgroundCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const colors = ['#ff6b6b', '#1e90ff', '#ffd93d', '#6bcf63', '#ff9ff3'];

  function drawShapesBackground() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    for (let i = 0; i < 50; i++) {
      const x = Math.random() * bgCanvas.width;
      const y = Math.random() * bgCanvas.height;
      const size = Math.random() * 30 + 10;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const shape = Math.floor(Math.random() * 3);
      bgCtx.fillStyle = color;

      if (shape === 0) {
        bgCtx.beginPath();
        bgCtx.arc(x, y, size / 2, 0, Math.PI * 2);
        bgCtx.fill();
      } else if (shape === 1) {
        bgCtx.fillRect(x, y, size, size);
      } else {
        bgCtx.beginPath();
        bgCtx.moveTo(x, y);
        bgCtx.lineTo(x + size, y);
        bgCtx.lineTo(x + size / 2, y - size);
        bgCtx.closePath();
        bgCtx.fill();
      }
    }
  }

  function resizeCanvas() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    drawShapesBackground();
  }

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("load", resizeCanvas);
</script>

<!-- ✅ التحقق من الإجابة -->
<script>
  function checkAnswer() {
    const userAnswer = document.getElementById('answer').value.trim();
    const correctAnswer = "(4,-2)";
    const clapSound = document.getElementById('clapSound');

    if (userAnswer.replace(/\s/g, '') === correctAnswer) {
      clapSound.play();
      alert("أحسنت! إجابتك صحيحة 🎉");
    } else {
      alert("الإجابة غير صحيحة. حاول مرة أخرى 😊");
    }
  }
</script>

</body>
</html>
